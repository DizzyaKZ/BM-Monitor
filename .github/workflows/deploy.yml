name: Deploy BM-Monitor to PS.kz

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Angular Production (/BM-Monitor/)
        run: npx ng build --configuration production --base-href /BM-Monitor/

      - name: 📂 Assemble deployment package
        run: |
          mkdir -p deploy_package/api
          if [ -d "dist/bm-monitor/browser" ]; then
            cp -r dist/bm-monitor/browser/* deploy_package/
          else
            cp -r dist/bm-monitor/* deploy_package/
          fi
          cp -r api/* deploy_package/api/
          cp .htaccess deploy_package/.htaccess

      - name: 🚀 Deploy to PS.kz via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/BM-Monitor/
          local-dir: deploy_package/
